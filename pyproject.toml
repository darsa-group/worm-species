[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "worm-species-paper"
version = "1.0.1"
description = "Earthworm model inference, training and specimen-aware analysis"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT for original project code; third-party notices apply"}
dynamic = ["dependencies"]

[project.optional-dependencies]
segmentation = ["ultralytics>=8.3", "opencv-python-headless>=4.8"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["dataset", "splits", "cache"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
