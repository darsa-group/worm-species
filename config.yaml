seed: 42

wandb:
  enabled: true
  project: worm-species-color-ablation
  entity: null
  group: null
  name: null
  mode: offline
  job_type: train
  tags:
    - multitask
    - earthworm_color
    - slurm
  save_code: true
  log_model: false

data:
  root_dir: "../petridish-worm-images"
  metadata_csv: "../petridish-worm-images/01_Segmented/global_metadata.csv"
  colour_retention: 1.0
  # choose one:
  # rel_path_seg      = segmented RGB image
  # rel_path_raw      = raw image
  # rel_path_segmask  = binary mask
  image_col: "rel_path_seg"
  mask_col: "rel_path_segmask"

  # target can be:
  # species_label, genus, life_stage
  target_col: "genus"

  # individual-level split column
  group_col: "barcode"

  # If barcode is already the individual ID, keep this false.
  # Set true only if barcodes look like individual_1, individual_2, etc.
  strip_final_number_from_group: false

  min_individuals_per_class: 3
  crop_to_foreground: false
  crop_pad: 0.15
  image_size: 224

  barcode_col: barcode
  species_requires_binomial: true

  target_cols:
    genus: genus
    species: species_label
    age: life_stage

  split_target_col: __taxon_for_split__

  taxonomic_uncertainty:
    uncertain_species_labels:
      - Lumbricus_sp
      - Aporrectodea_caliginosa_tuberculata

    uncertain_species_patterns:
      - "(?:^|_)sp(?:$|_)"

    resolved_species_label_overrides:
      Lumbricus_sp_terrestris_herculeus: Lumbricus_terrestris_herculeus

    life_stage_overrides:
      Lumbricus_sp_terrestris_herculeus: Adult

  
  min_individuals_per_class_by_task:
    genus: 3
    species: 3
    age: 3

multi_task:
  loss_weights:
    genus: 1.0
    species: 0.5
    age: 2.0

  hierarchy_loss:
    enabled: true
    parent_task: genus
    child_task: species
    weight: 0.5

  # Recommended because not every image has all three labels.
  normalize_loss_by_active_tasks: true

  # Other valid choices include genus_macro_f1, species_macro_f1, age_macro_f1.
  selection_metric: mean_macro_f1





colour_ablation:
  enabled: false
  start_percent: 100
  stop_percent: 0
  step_percent: 1
  combine_with_sweep: true

early_stopping:
  enabled: true
  monitor: "macro_f1"
  mode: "max"
  patience: 4
  min_delta: 0.0001

split:
  test_size: 0.20
  val_size: 0.15
  predefined_split_dir: "split_csv"
  use_predefined_splits: true
  save_splits: false

model:
  name: "efficientnet_b0"   # resnet18, resnet50, efficientnet_b0, vit_b_16, swin_t
  pretrained: true
  freeze_backbone: false

training:
  epochs: 200
  batch_size: 256
  lr: 0.0005
  weight_decay: 0.0001
  use_amp: true
  class_weight: true
  num_workers: 12
  val_interval: 5

output:
  out_dir: "outputs"

cache:
  enabled: true
  dir: "cache/images"
  root_dir_cache: "../cache"
  format: "png"
  rebuild: false
  num_workers: 8


test_cue_suppression:
  enabled: true

  saturation:
    enabled: true
    start: 1.0
    stop: 0.0
    step: 0.01

  grayscale:
    enabled: true

  channel_shuffle:
    enabled: true
    orders:
      - [2, 0, 1]

  bilateral_filter:
    enabled: true
    settings:
      - diameter: 5
        sigma_colour: 25
        sigma_space: 25
      - diameter: 7
        sigma_colour: 50
        sigma_space: 50
      - diameter: 9
        sigma_colour: 100
        sigma_space: 100

  gaussian_blur:
    enabled: true
    sigmas: [0.5, 1.0, 2.0, 4.0]

  patch_shuffle:
    enabled: true
    grid_sizes: [2, 4, 8]
    seed: 2026
      


matched_condition_training:
  enabled: true
  include_original: true
  deduplicate_equivalent_conditions: true
  evaluate_original_model_on_all_test_conditions: true

sweep:
  enabled: true

  parameters:
    model.name:
      - 'convnext_base'
      - "vit_b_16"

   
    
    
  
      


    