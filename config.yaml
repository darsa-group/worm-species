# Safe one-run quick start. Detailed defaults and transform catalogues live in
# configs/defaults/base.yaml; experiment plans live in configs/experiments/.
extends: configs/defaults/base.yaml

seed: 42

# Common data paths and input resolution.
data:
  root_dir: "../petridish-worm-images"
  metadata_csv: "../petridish-worm-images/01_Segmented/global_metadata.csv"
  image_size: 224

# Architecture and pretrained/fine-tuning switches.
model:
  name: efficientnet_b0
  pretrained: true
  freeze_backbone: false

# Optimisation choices for one canonical trainer process.
training:
  mode: multitask
  use_masked_labels: true
  epochs: 200
  batch_size: 256
  lr: 0.0005
  weight_decay: 0.0001
  use_amp: true
  class_weight: true

# Task and hierarchy weights; age is an ordinary selected task.
multi_task:
  loss_weights:
    genus: 1.0
    species: 0.5
    age: 2.0
  hierarchy_loss:
    enabled: true
    weight: 0.5

# W&B can be disabled independently; offline mode never contacts the service.
wandb:
  enabled: true
  project: worm-species-cues
  mode: offline

output:
  out_dir: outputs

cache:
  enabled: true
  dir: cache/images

# These are separate features. Keep all disabled for this one-run baseline.
input_condition:
  enabled: false
test_cue_suppression:
  enabled: false
condition_matrix_evaluation:
  enabled: false
matched_condition_training:
  enabled: false
colour_ablation:
  enabled: false
sweep:
  enabled: false
