extends: _base.yaml

data:
  sampler:
    type: cross_species_stage_contrastive
    species_per_stage: 3
    individuals_per_species_stage: 2
    images_per_individual: 1
    replacement: true

loss:
  age_supervised_contrastive:
    enabled: true
    weight: 0.1
    temperature: 0.07
    cross_species_positives: true

wandb: {group: performance-cross-species-age, tags: [performance, cross-species-age]}
slurm: {planning: {run_name_prefix: cross_species_age_batches}}
