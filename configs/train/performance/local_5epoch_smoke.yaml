extends: performance_full.yaml

model:
  pretrained: false

training:
  epochs: 5
  batch_size: 12
  num_workers: 0
  val_interval: 1
  use_amp: false
  gradient_diagnostics: {enabled: false, interval_steps: 100}

early_stopping: {enabled: false, patience: 5, min_delta: 0.0}

sweep:
  parameters:
    seed: [42]
    model.name: [convnext_base, vit_b_16, resnet18]
    data_holdout:
      - {enabled: false, name: original_baseline, question: Local five-epoch smoke simulation, remove_from: [train, validation], where: {}, evaluation_where: {}, primary_tasks: []}

wandb: {enabled: false, group: local-performance-smoke, tags: [local-smoke]}
output: {out_dir: local_slurm_simulation/results}
slurm: {planning: {run_name_prefix: local_5epoch_smoke}}
