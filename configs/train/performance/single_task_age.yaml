extends: _base.yaml

model:
  multitask_architecture: single_task
  target_task: age
  pooling: {type: global_average, dropout: 0.1}

multi_task:
  selection_metric: age_individual_macro_f1

training:
  gradient_diagnostics: {enabled: false, interval_steps: 100}

wandb: {group: performance-single-task-age, tags: [performance, single-task, age]}
slurm: {planning: {run_name_prefix: single_task_age}}
