extends: split_taxonomy_age.yaml

data:
  sampler:
    type: joint_species_stage
    replacement: true
    samples_per_epoch: null

training:
  gradient_strategy: {type: pcgrad}

loss:
  age_supervised_contrastive:
    enabled: true
    weight: 0.1
    temperature: 0.07
    cross_species_positives: true

wandb:
  group: generalisation-split-full
  tags: [generalisation, split-taxonomy-age, joint-sampler, pcgrad, age-supcon]

slurm:
  planning:
    run_name_prefix: split_full
