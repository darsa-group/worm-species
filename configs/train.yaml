# All new fits and subsequent analyses remain separate from the saved paper inputs.
output_root: outputs/new_training
device: cuda:0
workers: 2
cpu_threads: 8
# null preserves the historical batch size of each experiment.
# Lowering it is a new run setting and is recorded in each saved config.
batch_size: null
control_batch_size: 16
wandb:
  enabled: true
  project: worm-species-paper
  mode: offline
