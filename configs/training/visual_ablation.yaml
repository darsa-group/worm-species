condition_matrix_evaluation:
  enabled: false
  condition_names:
  - original
  write_reports: true
preprocessing:
  image_size: 224
  normalisation:
    enabled: true
    mean:
    - 0.485
    - 0.456
    - 0.406
    std:
    - 0.229
    - 0.224
    - 0.225
augmentation:
  enabled: true
  horizontal_flip:
    enabled: true
    probability: 0.5
  vertical_flip:
    enabled: true
    probability: 0.5
  rotation:
