      seed: 2026
  - name: patch_shuffle_16x16
    feature: spatial_layout
    transform: patch_shuffle
    strength: 16
    parameters:
      grid_size: 16
      seed: 2026
  - name: gaussian_blur_002pct
    feature: texture
    transform: gaussian_blur_percent
    strength: 2.0
    parameters:
      percent: 2
      max_sigma: 64.0
