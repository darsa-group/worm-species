slurm:
  enabled: true
  cluster_profile: genome
  account: worm-species
  partition: gpu-short,gpu-h200,gpu-l40s
  nodes: 1
  ntasks: 1
  cpus_per_task: 12
  memory: 12384
  time_limit: "01:30:00"
  gpus_per_task: 1
  array:
    max_active: 12
  setup:
    enabled: false
    per_node: false
    cpus_per_task: 8
    memory: 16G
    time_limit: "02:00:00"
  collection:
    enabled: true
    cpus_per_task: 1
    memory: 4096
    time_limit: "00:20:00"
  cleanup:
    enabled: false
    per_node: false
    cpus_per_task: 1
    memory: 2048
    time_limit: "00:30:00"
  scratch:
    mode: job_local_cache
    root: /tmp/${USER}/worm_species
    nodes: []
    copy_project: false
    copy_data: false
    data_include: []
    reuse_ready_cache: true
    cleanup_after_run: true
    copy_cache_to_tmp: 1
    tmp_reserve_gb: 5
    ready_marker: CACHE_READY
  environment:
    conda_sh: ${HOME}/miniforge3/etc/profile.d/conda.sh
    conda_env: wormspecies
  paths:
    project_root: ${HOME}/worm-species/source
    data_root: ${HOME}/worm-species/data
    metadata_csv: ${HOME}/worm-species/data/01_Segmented/global_metadata.csv
    results_root: outputs_slurm
    cache_root: ${HOME}/worm-species/data/image_cache
  logging:
    directory: logs/slurm
    separate_stdout_stderr: true
  monitoring:
    enabled: false
    interval_seconds: 5
  submission:
    extra_sbatch_args: []
    exclude_nodes: []
