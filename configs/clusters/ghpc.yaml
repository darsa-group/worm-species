slurm:
  enabled: true
  cluster_profile: ghpc
  account: worm-species
  partition: ghpc_gpu
  nodes: 1
  ntasks: 1
  gpus_per_task: 1
  setup:
    enabled: true
    per_node: true
    cpus_per_task: 4
    memory: 8192
    time_limit: "01:00:00"
  cleanup:
    enabled: true
    per_node: true
    cpus_per_task: 1
    memory: 2048
    time_limit: "00:30:00"
  scratch:
    mode: node_local
    root: /scratch/${USER}/worm_species
    # Deliberately empty: node-local workflows must explicitly identify the
    # GPU nodes whose independent /scratch filesystems are prepared/cleaned.
    nodes: []
    copy_project: true
    copy_data: true
    data_include:
      - global_metadata.csv
      - "*_seg.jpg"
    reuse_ready_cache: true
    cleanup_after_run: true
    copy_cache_to_tmp: 0
    tmp_reserve_gb: 0
    ready_marker: READY
  environment:
    conda_sh: /usr/home/qgg/mehrot/miniconda3/etc/profile.d/conda.sh
    conda_env: wormspecies
  paths:
    project_root: .
    data_root: /usr/home/qgg/mehrot/petridish-worm-images
    metadata_csv: /usr/home/qgg/mehrot/petridish-worm-images/01_Segmented/global_metadata.csv
    results_root: outputs_slurm
    cache_root: cache/images
  logging:
    directory: logs/slurm
    separate_stdout_stderr: true
  monitoring:
    enabled: true
    interval_seconds: 5
  submission:
    extra_sbatch_args: []
    exclude_nodes: []
