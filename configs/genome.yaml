slurm:
  enabled: true
  cluster_profile: genome
  account: worm-species
  partition: gpu-short
  nodes: 1
  ntasks: 1
  cpus_per_task: 8
  memory: 60384
  time_limit: 02:00:00
  gpus_per_task: 1
  array:
    max_active: 12
  setup:
    enabled: false
    per_node: false
    cpus_per_task: 8
    memory: 16G
    time_limit: 02:00:00
  collection:
    enabled: true
    partition: null
    cpus_per_task: 1
    memory: 4096
    time_limit: 00:20:00
  cleanup:
    enabled: false
    per_node: false
    cpus_per_task: 1
    memory: 2048
    time_limit: 00:30:00
  scratch:
    mode: node_shared_cache
    root: /tmp/${USER}/worm_species
    nodes: []
    copy_project: false
    copy_data: false
    data_include: []
    reuse_ready_cache: true
    cleanup_after_run: false
    copy_cache_to_tmp: 1
    tmp_reserve_gb: 5
    ready_marker: CACHE_READY
  environment:
    conda_sh: ${HOME}/miniforge3/etc/profile.d/conda.sh
    conda_env: wormspecies
  paths:
    project_root: ${PWD}
    data_root: ${PWD}/data/original
    metadata_csv: ${PWD}/data/original/01_Segmented/global_metadata.csv
    results_root: outputs/training
    cache_root: ${PWD}/outputs/cache
  logging:
    directory: logs/slurm
    separate_stdout_stderr: true
  monitoring:
    enabled: false
    interval_seconds: 5
  submission:
    extra_sbatch_args: []
    exclude_nodes: []
