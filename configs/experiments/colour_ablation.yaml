extends: ../../config.yaml

# Each externally generated retention value is one matched-condition training
# run.  These switches preserve the former colour-ablation profile explicitly.
experiment:
  type: matched_condition

training:
  use_masked_labels: true

multi_task:
  hierarchy_loss:
    enabled: true

wandb:
  enabled: true

matched_condition_training:
  enabled: false

test_cue_suppression:
  enabled: false

colour_ablation:
  enabled: true
  start_percent: 100
  stop_percent: 0
  step_percent: 1
  combine_with_sweep: true

slurm:
  planning:
    experiment_type: colour_ablation
    external_expansion: colour_ablation
  cpus_per_task: 16
  memory: 16384
  time_limit: "04:00:00"
  array:
    max_active: 2
  collection:
    enabled: true
    cpus_per_task: 1
    memory: 4096
    time_limit: "00:20:00"
