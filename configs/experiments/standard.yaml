extends: ../../config.yaml

# Standard masked multitask training uses the explicit canonical switches.  The
# historical ``masked`` profile disabled hierarchy loss and W&B implicitly.
experiment:
  type: standard

training:
  use_masked_labels: true

multi_task:
  hierarchy_loss:
    enabled: false

wandb:
  enabled: false

sweep:
  enabled: true
  parameters:
    model.name:
      - convnext_base
      - vit_b_16

slurm:
  planning:
    experiment_type: standard
    external_expansion: sweep
  cpus_per_task: 8
  memory: 16384
  time_limit: "04:00:00"
  array:
    max_active: 10
  collection:
    enabled: false
