extends: ../../config.yaml

# The canonical trainer derives its behaviour from these switches.  Per-run
# experiment.type remains inferred: transformed conditions are matched training,
# while the original condition may additionally run fixed-RGB stress evaluation.
training:
  use_masked_labels: true

multi_task:
  hierarchy_loss:
    enabled: true

wandb:
  enabled: true
  project: worm-species-cues
  # Genome dual-cue submissions historically logged online unless the caller
  # explicitly selected another mode through configuration or --legacy-env.
  mode: online

matched_condition_training:
  enabled: true
  include_original: true
  deduplicate_equivalent_conditions: true
  evaluate_original_model_on_all_test_conditions: true

colour_ablation:
  enabled: false

slurm:
  planning:
    experiment_type: dual_cue
    external_expansion: dual_cue
  cpus_per_task: 16
  memory: 16384
  time_limit: "04:00:00"
  array:
    max_active: 2
  collection:
    enabled: true
    cpus_per_task: 1
    memory: 4096
    time_limit: "00:20:00"
