extends: ../../config.yaml

# Small DINOv3 comparison: 2 backbones x 2 learning rates x 3 hierarchy-loss
# weights = 12 original-RGB training runs. Every checkpoint is then evaluated
# on all 24 deterministic test conditions below (288 evaluation cells).
model:
  pretrained: true
  freeze_backbone: false

training:
  epochs: 100
  batch_size: 32
  val_interval: 5

multi_task:
  # Keep ordinary task losses equal so hierarchy weight is the only loss-recipe
  # dimension in the sweep.
  loss_weights: {genus: 1.0, species: 1.0, age: 1.0}
  normalize_loss_by_active_tasks: true
  hierarchy_loss:
    enabled: true
    parent_task: genus
    child_task: species
    weight: 0.5

# All augmentation is train-only. Gaussian blur is stochastic here; the fixed
# Gaussian conditions in the evaluation catalogue remain deterministic.
augmentation:
  enabled: true
  horizontal_flip: {enabled: true, probability: 0.5}
  vertical_flip: {enabled: true, probability: 0.5}
  rotation: {enabled: true, degrees: 270}
  gaussian_blur:
    enabled: true
    probability: 0.5
    kernel_size: 5
    sigma: [0.1, 2.0]

wandb:
  enabled: false

sweep:
  enabled: true
  parameters:
    model.name:
      - dinov3_vitb16
      - dinov3_convnext_base
    training.lr:
      - 0.0005
      - 0.0001
    multi_task.hierarchy_loss.weight:
      - 0.0
      - 0.5
      - 1.0
  # Train only on original RGB. Conditions below are evaluation-only.
  conditions:
    - {name: original, feature: baseline, transform: original, strength: 0.0, parameters: {}}

evaluation:
  # Disabled as a separate evaluator; this section is the canonical condition
  # registry reused by the condition matrix below.
  test_conditions:
    enabled: false
    evaluate_original_training: false
    conditions:
      - name_template: saturation_{percent:03d}pct
        feature: colour
        transform: saturation
        parameter: retention
        range: {start: 1.0, stop: 0.0, step: -0.1}
      - {name: grayscale, feature: colour, transform: grayscale, strength: 1.0, parameters: {}}
      - {name: channel_shuffle_201, feature: colour, transform: channel_shuffle, strength: 1.0, parameters: {order: [2, 0, 1]}}
      - {name: bilateral_d5_c25_s25, feature: texture, transform: bilateral_filter, strength: 25.0, parameters: {diameter: 5, sigma_colour: 25.0, sigma_space: 25.0}}
      - {name: bilateral_d7_c50_s50, feature: texture, transform: bilateral_filter, strength: 50.0, parameters: {diameter: 7, sigma_colour: 50.0, sigma_space: 50.0}}
      - {name: bilateral_d9_c100_s100, feature: texture, transform: bilateral_filter, strength: 100.0, parameters: {diameter: 9, sigma_colour: 100.0, sigma_space: 100.0}}
      - {name: gaussian_sigma_0.5, feature: texture, transform: gaussian_blur, strength: 0.5, parameters: {sigma: 0.5}}
      - {name: gaussian_sigma_1, feature: texture, transform: gaussian_blur, strength: 1.0, parameters: {sigma: 1.0}}
      - {name: gaussian_sigma_2, feature: texture, transform: gaussian_blur, strength: 2.0, parameters: {sigma: 2.0}}
      - {name: gaussian_sigma_4, feature: texture, transform: gaussian_blur, strength: 4.0, parameters: {sigma: 4.0}}
      - {name: patch_shuffle_grid_2, feature: shape, transform: patch_shuffle, strength: 2, parameters: {grid_size: 2, seed: 2026}}
      - {name: patch_shuffle_grid_4, feature: shape, transform: patch_shuffle, strength: 4, parameters: {grid_size: 4, seed: 2026}}
      - {name: patch_shuffle_grid_8, feature: shape, transform: patch_shuffle, strength: 8, parameters: {grid_size: 8, seed: 2026}}

  condition_matrix:
    enabled: true
    conditions:
      - original
      - saturation_100pct
      - saturation_090pct
      - saturation_080pct
      - saturation_070pct
      - saturation_060pct
      - saturation_050pct
      - saturation_040pct
      - saturation_030pct
      - saturation_020pct
      - saturation_010pct
      - saturation_000pct
      - grayscale
      - channel_shuffle_201
      - bilateral_d5_c25_s25
      - bilateral_d7_c50_s50
      - bilateral_d9_c100_s100
      - gaussian_sigma_0.5
      - gaussian_sigma_1
      - gaussian_sigma_2
      - gaussian_sigma_4
      - patch_shuffle_grid_2
      - patch_shuffle_grid_4
      - patch_shuffle_grid_8
    write_reports: true

output:
  out_dir: outputs/dinov3_rgb_stress

slurm:
  planning:
    experiment_type: dinov3_rgb_stress
    external_expansion: sweep
  cpus_per_task: 16
  memory: 32768
  time_limit: "08:00:00"
  array:
    max_active: 2
  collection:
    enabled: true
