schema_version: 1

# GenomeDK paths. Environment variables are expanded when the command runs.
paths:
  project_root: /faststorage/project/worm-species/source
  gbif_manifest: /faststorage/project/worm-species/data/gbif_oligochaeta/curation/curated_manifest.csv
  petri_split_dir: /faststorage/project/worm-species/source/split_csv
  petri_data_root: /faststorage/project/worm-species/data
  output_root: /faststorage/project/worm-species/source/outputs/gbif_training_3backbone_fixed_budget
  conda_sh: /home/devd/miniconda3/etc/profile.d/conda.sh
  conda_env: wormspecies
  publication_baseline_root: /faststorage/project/worm-species/source/publication_30seed_result/runs/baseline

data:
  curation_labels: [keep]
  minimum_independent_groups_per_class: 3
  gbif_split: {train: 0.65, validation: 0.15, test: 0.20}
  seed: 2026
  image_size: 224
  target_columns: {genus: genus, species: species, age: age}

models:
  primary: [convnext_base, vit_b_16, resnet50]
  primary_seeds: [40, 140, 240]
  dino: [dinov3_vitb16]
  dino_seeds: [40, 140, 240]
  pretrained: true

training:
  # Must be a positive even number. Mixed training always derives an exact
  # half-batch per domain (256 -> 128 GBIF + 128 Petri).
  batch_size: 256
  num_workers: 12
  prefetch_factor: 4
  persistent_workers: true
  pin_memory: true
  use_amp: true
  steps_per_domain: 10000
  mixed_steps: 20000
  validation_interval_steps: 500
  checkpoint_interval_steps: 500
  backbone_lr: 0.00001
  head_lr: 0.0001
  weight_decay: 0.05
  warmup_steps: 1000
  fixed_budget: true
  checkpoint_selection_min_delta: 0.0
  class_weight: true
  loss_weights: {genus: 1.0, species: 0.5, age: 2.0}
  hierarchy_loss:
    parent_task: genus
    child_task: species
    weights: [0.0, 0.5]
  selection_metric: domain_balanced_macro_f1
  augmentation:
    enabled: true
    horizontal_flip: {enabled: true, probability: 0.5}
    vertical_flip: {enabled: true, probability: 0.5}
    rotation: {enabled: true, degrees: 180}

# Build the deterministic resize once on shared storage, then copy this cache
# once per physical compute node for all training array tasks on that node.
preprocessed_cache:
  enabled: true
  root: /faststorage/project/worm-species/source/outputs/gbif_training_3backbone_fixed_budget/preprocessed_cache
  node_root: /tmp/${USER}/worm_species/gbif_training
  format: png
  workers: 16
  progress_interval_images: 1000
  tmp_reserve_gb: 5

inference:
  shards: 12
  batch_size: 256
  num_workers: 12
  prefetch_factor: 4

wandb:
  enabled: true
  project: worm-species-gbif-transfer
  entity: null
  mode: online
  group: gbif-petri-order-3backbone-fixed-budget-v1
  save_code: false
  log_model: false

slurm:
  account: worm-species
  partition: gpu-short,gpu-l40s,gpu-h200
  gpus_per_task: 1
  array_max_active: 12
  training:
    cpus_per_task: 16
    memory: 20G
    time_limit: "04:00:00"
  inference:
    cpus_per_task: 12
    memory: 16G
    time_limit: "02:00:00"
  preprocessing:
    cpus_per_task: 16
    memory: 20G
    time_limit: "02:00:00"
  merge:
    cpus_per_task: 4
    memory: 8G
    time_limit: "00:30:00"

reporting:
  confidence_level: 0.95
  formats: [svg, pdf]
