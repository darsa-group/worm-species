# Stage 2: matched visual-information ablations.
# 5 backbones x 22 conditions = 110 model fits.
extends: genome_ablation_baseline.yaml

multi_task:
  loss_weights: {genus: 1.0, species: 0.5, age: 2.0}
  hierarchy_loss:
    enabled: false
    weight: 0.0

wandb:
  group: paper-visual-ablation
  tags: [paper, visual-ablation]

sweep:
  parameters:
    # Downstream ablations remain single-seed despite inheriting the baseline.
    seed: [42]
    model.name:
      - resnet50
      - convnext_base
      - vit_b_16
    multi_task.loss_weights:
      - {genus: 1.0, species: 0.5, age: 2.0}
  conditions:
    - name: colour_000pct
      feature: colour
      transform: saturation
      strength: 1.0
      parameters: {retention: 0.0}

    - {name: patch_shuffle_2x2, feature: spatial_layout, transform: patch_shuffle, strength: 2, parameters: {grid_size: 2, seed: 2026}}
    - {name: patch_shuffle_4x4, feature: spatial_layout, transform: patch_shuffle, strength: 4, parameters: {grid_size: 4, seed: 2026}}
    - {name: patch_shuffle_8x8, feature: spatial_layout, transform: patch_shuffle, strength: 8, parameters: {grid_size: 8, seed: 2026}}
    - {name: patch_shuffle_16x16, feature: spatial_layout, transform: patch_shuffle, strength: 16, parameters: {grid_size: 16, seed: 2026}}

    - name_template: gaussian_blur_{percent:03d}pct
      feature: texture
      transform: gaussian_blur_percent
      parameter: percent
      parameters: {max_sigma: 16.0}
      range: {start: 10, stop: 100, step: 10}

    # Retained linear dimensions at 224 px:
    # 224, 168, 112, 56, 28, 14, and the 1 px extreme control.
    - {name: resolution_loss_000pct, feature: spatial_detail, transform: resolution_loss, strength: 0.0, parameters: {percent: 0}}
    - {name: resolution_loss_025pct, feature: spatial_detail, transform: resolution_loss, strength: 25.0, parameters: {percent: 25}}
    - {name: resolution_loss_050pct, feature: spatial_detail, transform: resolution_loss, strength: 50.0, parameters: {percent: 50}}
    - {name: resolution_loss_075pct, feature: spatial_detail, transform: resolution_loss, strength: 75.0, parameters: {percent: 75}}
    - {name: resolution_loss_087.5pct, feature: spatial_detail, transform: resolution_loss, strength: 87.5, parameters: {percent: 87.5}}
    - {name: resolution_loss_093.75pct, feature: spatial_detail, transform: resolution_loss, strength: 93.75, parameters: {percent: 93.75}}
    - {name: resolution_loss_100pct, feature: spatial_detail, transform: resolution_loss, strength: 100.0, parameters: {percent: 100}}

cache:
  condition_variants:
    enabled: true
    protocol_version: 1
    storage: torch_float32

# Matched testing is automatic. This adds one original-image cross-condition
# evaluation per checkpoint without creating another model fit.
evaluation:
  test_conditions: {enabled: false, conditions: [], evaluate_original_training: false}
  condition_matrix:
    enabled: true
    conditions: [original]
    allow_training_condition_absent: true
    write_reports: false

output:
  out_dir: paper_result/runs/visual_ablation

slurm:
  planning:
    experiment_type: genome_visual_ablation
    external_expansion: sweep
    clear_run_names: true
