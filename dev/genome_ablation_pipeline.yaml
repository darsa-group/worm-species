# One-command, dependency-chained paper experiment.
name: genome_ablation_paper
cluster_config: ../configs/clusters/genome.yaml
paper_result_dir: ../paper_result
dependency: afterok

base_cache:
  enabled: true
  source_stage: baseline
  directory_name: image_cache_paper_v1
  cpus_per_task: 8
  memory: 16G
  time_limit: "04:00:00"

condition_cache:
  enabled: true
  source_stage: visual_ablation
  directory_name: image_condition_cache_paper_v1
  transforms: [gaussian_blur_percent, patch_shuffle, resolution_loss]
  cpus_per_task: 8
  memory: 16G
  time_limit: "04:00:00"
  max_active: 8

stages:
  - name: baseline
    config: genome_ablation_baseline.yaml
  - name: visual_ablation
    config: genome_visual_ablation.yaml
  - name: data_holdouts
    config: genome_data_holdouts.yaml

report:
  enabled: true
  script: ../scripts/build_paper_results.py
  style: paper_report_style.yaml
  cpus_per_task: 4
  memory: 16G
  time_limit: "01:00:00"
