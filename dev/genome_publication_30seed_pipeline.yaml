# One dry-run/resumable publication pipeline. Submission remains explicit.
name: genome_publication_30seed
cluster_config: ../configs/clusters/genome.yaml
paper_result_dir: ../publication_30seed_result
dependency: afterok
required_hierarchy_loss_weights: [0.0]

base_cache:
  enabled: true
  source_stage: baseline
  directory_name: image_cache_publication_30seed_v1
  cpus_per_task: 128
  memory: 64G
  time_limit: "04:00:00"

condition_cache:
  enabled: true
  source_stages: [visual_ablation, visual_interactions]
  consumer_stages: [visual_ablation, visual_interactions]
  directory_name: image_condition_cache_publication_30seed_v1
  transforms: [gaussian_blur_percent, patch_shuffle, resolution_loss, binary_mask, composed]
  cpus_per_task: 128
  memory: 64G
  time_limit: "04:00:00"
  max_active: 12

stages:
  - {name: baseline, config: genome_publication_30seed_baseline.yaml}
  - {name: visual_ablation, config: genome_publication_30seed_visual.yaml}
  - {name: visual_interactions, config: genome_publication_30seed_interactions.yaml}
  - {name: adult_taxon_baseline, config: genome_publication_30seed_taxon_baseline.yaml}
  - {name: adult_taxon_holdouts, config: genome_publication_30seed_taxon_holdouts.yaml}
  - {name: biological_transfer_holdouts, config: genome_publication_30seed_biological_transfer.yaml}

report:
  enabled: true
  script: ../scripts/build_publication_bundle.py
  style: paper_report_style.yaml
  cpus_per_task: 8
  memory: 64G
  time_limit: "02:00:00"
