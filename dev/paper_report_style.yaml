# Edit this file, then rerun scripts/build_paper_results.py.
# No model training or scheduler submission is involved.
dpi: 300
font_size: 10
axes_grid: false

palette:
  # Okabe-Ito colour-blind-safe palette. Plots also use marker/line redundancy.
  - "#0072B2"
  - "#E69F00"
  - "#009E73"
  - "#CC79A7"
  - "#56B4E9"
  - "#D55E00"
  - "#F0E442"
  - "#000000"

best_baseline_colour: "#111111"
chance_colour: "#777777"
workflow_data_colour: "#D9EDF7"
workflow_model_colour: "#DFF0D8"
workflow_experiment_colour: "#FCE8C3"
heatmap_colormap: viridis
