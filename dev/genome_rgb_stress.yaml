# Original-RGB Genome training followed by the transformed-test catalogue inherited
# from genome_cues_matched.yaml. This creates 64 original-RGB fits, then
# evaluates each checkpoint on 24 conditions; it does not fit one model per
# test condition.
extends: genome_cues_matched.yaml

sweep:
  # YAML lists replace inherited lists, so original is the sole train condition.
  conditions:
    - name: original
      feature: baseline
      transform: original
      strength: 0.0
      parameters: {}

evaluation:
  test_conditions:
    enabled: true
    evaluate_original_training: true
    # The complete 24-condition catalogue is inherited from the matched config.

  condition_matrix:
    enabled: false
    conditions: []
    write_reports: true

wandb:
  group: genome-rgb-stress

slurm:
  planning:
    experiment_type: genome_rgb_stress
    external_expansion: sweep
