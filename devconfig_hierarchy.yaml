# Hierarchy-loss variant of the matched-condition development experiment.
# 192 parameter combinations x 114 conditions = 21,888 model fits.
# Hierarchy is always enabled; only its meaningful weight is swept.
extends: devconfig.yaml

multi_task:
  hierarchy_loss:
    enabled: true
    parent_task: genus
    child_task: species
    weight: 0.5

sweep:
  parameters:
    multi_task.hierarchy_loss.weight:
      - 0.2
      - 0.5
      - 1.0

wandb:
  group: genome-cues-hierarchy

slurm:
  planning:
    experiment_type: genome_cues_hierarchy
    external_expansion: sweep
